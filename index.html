<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4f2a" />
  <title>Jess' Dog Army</title>
  <link rel="stylesheet" href="styles.css?v=mission-topbar-1" />
  <link rel="stylesheet" href="mobile-fix.css?v=mission-topbar-1" />
  <style>
    .top-mission-btn {
      min-width: 110px;
      align-self: stretch;
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 6px 8px;
      border-radius: 16px;
      background: #3f8f5f;
      box-shadow: 0 5px 0 #28623f;
      color: #fff6df;
      line-height: 1.05;
    }

    .top-mission-btn span {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.9;
    }

    .top-mission-btn strong {
      font-size: 0.78rem;
      text-align: center;
    }

    .top-mission-btn:disabled {
      opacity: 0.45;
      box-shadow: none;
    }

    .landfill-frame-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #172316;
      z-index: 9999;
      overflow: hidden;
      touch-action: none;
    }

    .landfill-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #172316;
    }

    @media (max-width: 390px) {
      .top-mission-btn {
        min-width: 96px;
        padding: 5px 6px;
        border-radius: 13px;
      }

      .top-mission-btn span {
        font-size: 0.48rem;
      }

      .top-mission-btn strong {
        font-size: 0.66rem;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <script type="module" src="src/app.js?v=mission-topbar-1"></script>
</body>
</html>
